<style>
/* ===== OSU CATEGORY + PAGE CONTENT + MEGA OVERLAY ===== */
.osu-shop-shell{
  position:relative;

  height:auto;

}
.osu-sidebar{

  height:100vh;
  background:#fff;
  border-right:1px solid #e4e8eb;
}
.osu-sidebar-head{
  height:72px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #edf0f2;
  box-sizing:border-box;
}
.osu-sidebar-head strong{font-size:24px;color:#173b65}
.osu-sidebar-scroll{max-height:608px;overflow-y:auto}
.osu-sidebar-list{margin:0;padding:8px 0;list-style:none}
.osu-sidebar-button{
  width:100%;min-height:56px;padding:7px 14px 7px 12px;
  border:0;background:#fff;display:flex;align-items:center;gap:11px;
  text-align:left;cursor:pointer;box-sizing:border-box;
}
.osu-sidebar-button:hover,.osu-sidebar-button.is-active{background:#e7f2ff}
.osu-sidebar-button.is-active .osu-sidebar-name{color:#1671d8;font-weight:600}
.osu-sidebar-icon{width:38px;height:38px;flex:0 0 38px;border-radius:50%;object-fit:cover;background:#f2f4f5}
.osu-sidebar-name{flex:1;min-width:0;color:#26343c;font-size:14px;line-height:1.35}
.osu-sidebar-arrow{font-size:22px;color:#71808b}

/* CONTENT THẬT CỦA PAGE */
.osu-page-content{
  position:relative;
  z-index:5;
  flex:1;
  min-width:0;
  min-height:100vh;
  height:auto;
  padding:35px;
  background:#fff;
  box-sizing:border-box;
}
.osu-page-demo{
  min-height:calc(100vh - 70px);
  padding:0;
  border:0;
  border-radius:0;
  background:#fff;
  box-sizing:border-box;
}
.osu-page-demo h1{margin:0 0 12px;font-size:28px;color:#1f2d36}
.osu-page-demo p{margin:0;color:#6c7880;line-height:1.6}

/* MEGA MENU: OVERLAY CHỈ ĐÈ LÊN PHẦN CONTENT BÊN PHẢI */
.osu-mega-overlay{
  position:absolute;
  left:250px;
  top:0;
  right:auto;
  width:500px;
  min-height:100%;
  z-index:99999;
  pointer-events:none;
  visibility:hidden;
  opacity:0;
  transform:translateX(10px);
  transition:opacity .18s ease,transform .18s ease,visibility .18s ease;
}
.osu-mega-overlay.is-open{
  pointer-events:auto;
  visibility:visible;
  opacity:1;
  transform:translateX(0);
}
.osu-mega-panel{
  width:100%;
  height:auto;
  min-height:100vh;
  max-height:100vh;
  overflow-y:auto;
  background:#fff;
  box-shadow:0 12px 40px rgba(20,35,45,.18);
  box-sizing:border-box;
}
.osu-mega-inner{padding:30px}
.osu-mega-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;margin-bottom:24px;
}
.osu-mega-title{margin:0;font-size:21px;color:#202e37}
.osu-mega-subtitle{margin:6px 0 0;font-size:13px;color:#7a858c}
.osu-mega-close{border:0;background:transparent;font-size:27px;cursor:pointer;color:#56636c}

/* BANNER + CATEGORY CONTENT */
.osu-mega-banners{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:28px}
.osu-mega-banner{height:125px;border-radius:12px;overflow:hidden;background:#eef5fa}
.osu-mega-banner img{width:100%;height:100%;object-fit:cover}
.osu-mega-section{padding:22px 0;border-top:1px solid #e9edef}
.osu-mega-section h3{margin:0 0 17px;font-size:15px;color:#26343c}
.osu-mega-circles{display:grid;grid-template-columns:repeat(5,1fr);gap:20px 14px}
.osu-mega-circle{text-align:center;text-decoration:none;color:#26343c}
.osu-mega-circle img{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#f2f4f5;display:block;margin:0 auto 8px}
.osu-mega-circle span{font-size:12px;line-height:1.35}
.osu-mega-columns{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.osu-mega-col h4{margin:0 0 9px;font-size:13px;color:#25333b}
.osu-mega-col a{display:block;margin:0 0 7px;color:#64717a;font-size:12px;text-decoration:none}
.osu-mega-col a:hover{color:#1671d8}

/* MOBILE */
@media(min-width:768px) and (max-width:820px){
  .osu-mega-overlay{
    width:calc(100vw - 250px);
  }
}

@media(max-width:767px){
  .osu-shop-shell{
    display:block;
    min-height:0;
    height:auto;
  }
  .osu-sidebar{
    width:100%;
    min-height:0;
    height:auto;
    border-right:0;
    border-bottom:1px solid #e4e8eb;
  }
  .osu-sidebar-head{height:58px}
  .osu-sidebar-scroll{
    height:auto;
    max-height:250px;
  }
  .osu-page-content{padding:15px}
  .osu-page-demo{min-height:300px}
  .osu-mega-overlay{
    left:0;
    top:0;
    right:0;
    width:100%;
  }
  .osu-mega-panel{
    height:100vh;
    min-height:100vh;
    max-height:100vh;

  }
  .osu-mega-inner{padding:20px 15px}

  .osu-mega-circles{grid-template-columns:repeat(3,1fr)}
  .osu-mega-columns{grid-template-columns:repeat(2,1fr)}
}

          "https://placehold.co/900x260/eaf5ff/2476bd?text=THE+QUA+TANG+OSU",
          "https://placehold.co/900x260/fff0dd/d86b00?text=QUA+TANG"
        )+
        `<section class="osu-mega-section"><h3>Thẻ quà tặng</h3>${
          columns([
            ["Mệnh giá","100.000đ","200.000đ","500.000đ"],
            ["Dành cho","Gia đình","Bạn bè","Đồng nghiệp"],
            ["Cách dùng","Mua hàng","Tặng người thân","Voucher"]
          ])
        }</section>`
    },

    dry:{
      title:"Gạo, đậu, bột, đồ khô",
      subtitle:"Nhóm thực phẩm khô dùng hằng ngày",
      html:
        `<section class="osu-mega-section" style="border-top:0;padding-top:0"><h3>Danh mục</h3>${
          columns([
            ["Gạo","Gạo trắng","Gạo thơm","Gạo lứt","Gạo ST25"],
            ["Đậu","Đậu xanh","Đậu đỏ","Đậu đen","Đậu gà"],
            ["Bột","Bột mì","Bột chiên","Bột ngũ cốc"],
            ["Đồ khô","Rong biển","Nấm khô","Hạt khô","Miến & bún"]
          ])
        }</section>`
    }
  };

  function closeMega(){
    overlay.classList.remove("is-open");
    buttons.forEach(b=>b.classList.remove("is-active"));
  }

  buttons.forEach(button=>{
    button.addEventListener("click",()=>{
      const key = button.getAttribute("data-osu-cat");
      const item = data[key];
      if(!item) return;

      const already = button.classList.contains("is-active") &&
                      overlay.classList.contains("is-open");

      if(already){
        closeMega();
        return;
      }

      buttons.forEach(b=>b.classList.remove("is-active"));
      button.classList.add("is-active");

      title.textContent = item.title;
      subtitle.textContent = item.subtitle;
      body.innerHTML = item.html;

      overlay.classList.add("is-open");
      overlay.scrollTop = 0;
    });
  });

  if(close){
    close.addEventListener("click",closeMega);
  }

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape") closeMega();
  });

})();
</script>
